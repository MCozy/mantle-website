<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mantle — Accept Invite</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Inter', sans-serif; background: #F0F4F1; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .card { background: white; border-radius: 20px; padding: 40px 32px; max-width: 400px; width: 100%; text-align: center; box-shadow: 0 4px 24px rgba(0,0,0,0.08); }
    .brand { font-family: Georgia, serif; font-size: 28px; color: #1E2D3A; margin-bottom: 24px; }
    h1 { font-size: 22px; color: #1A2420; margin-bottom: 12px; }
    p { font-size: 15px; color: #5A6B62; line-height: 1.6; margin-bottom: 24px; }
    .btn { display: block; background: #6B9E78; color: white; text-align: center; padding: 16px 24px; border-radius: 12px; font-weight: 600; font-size: 16px; text-decoration: none; margin-bottom: 12px; }
    .btn:hover { background: #5A8D67; }
    .btn-outline { display: block; background: white; color: #1E2D3A; text-align: center; padding: 14px 24px; border-radius: 12px; font-weight: 600; font-size: 15px; text-decoration: none; border: 1.5px solid #D6DDD8; }
    .btn-outline:hover { background: #F0F4F1; }
    .hint { font-size: 12px; color: #8A9690; margin-top: 16px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Mantle</div>
    <h1>You've been invited</h1>
    <p>Open this link on your iPhone with Mantle installed to accept the invite.</p>
    <a href="https://apps.apple.com/app/mantle-home-maintenance/id6761501923" class="btn">Download Mantle</a>
    <a href="https://trymantle.app" class="btn-outline">Learn more</a>
    <p class="hint">Already have the app? Open this page on your iPhone and the invite will open automatically.</p>
  </div>
</body>
</html>
